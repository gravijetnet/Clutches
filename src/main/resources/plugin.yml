name: Clutches
version: 1.0.0
main: net.gravijet.clutches.Clutches
author: gravijet
description: Clutch training with custom knockback, levels, coins, cosmetics and leaderboards.
commands:
  clutch:
    description: Menu, knockback, settings, statistics, leaderboards and administration commands.
    usage: /clutch [menu|lobby|settings|cosmetics|stats|top|setspawn|setclutch|givecoins|reload]
permissions:
  clutches.admin:
    description: Set the arena, grant coins and reload configuration.
    default: op